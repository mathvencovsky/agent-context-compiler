name: CI

on:
  push:
  pull_request:

# Least privilege for GITHUB_TOKEN: the job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Settings/env mapping (1:1 with app.config.Settings and .env.example).
      # Services run via docker compose below; from the runner host they are
      # reachable on localhost through the compose-published ports.
      ENV: dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nina
      S3_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY: nina-dev-access-key
      S3_SECRET_KEY: nina-dev-secret-key
      S3_BUCKET: nina-blobs
      S3_REGION: us-east-1

    steps:
      # Actions pinned to the commit their tag pointed at on 2026-10-28 (read
      # with git ls-remote); bump deliberately, never by a moving tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false

      # The runner ships ~25 GB of preinstalled SDKs we never use (Android,
      # .NET, GHC, CodeQL, Swift). Chromium (~500 MB) plus the Docker stack
      # (Postgres + SeaweedFS + aws-cli) can exhaust the ~14 GB free disk and
      # fail a late step with "No space left on device". Reclaim space first.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5 (v5.4.2)

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Object storage is SeaweedFS (Apache-2.0, S3-compatible). GitHub Actions
      # service containers cannot override the image command, and this image's
      # entrypoint does not start the S3 gateway by default, so we bring the
      # whole verified compose stack up in-job instead (Postgres + SeaweedFS,
      # which creates its own bucket). See DECISIONS.md.
      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres seaweedfs
          docker compose ps

      - name: Apply migrations
        run: make migrate

      # Main gate: lint, types and the full suite EXCLUDING browser tests, so it
      # stays fast and needs no Chromium. The `check` target runs
      # `uv run pytest -m "not browser"` (integration runs here because the
      # compose infra above is up).
      - name: Lint, types and tests
        run: make check

      # Dedicated browser step: install Chromium (with its OS deps on Linux)
      # and run ONLY the browser-marked Playwright tests. Kept separate so a
      # browser-tooling failure never blocks the fast gate above.
      - name: Browser tests (Chromium)
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -m "browser" --maxfail=1

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v
