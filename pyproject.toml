[project]
name = "nina"
version = "0.1.0"
description = "NINA: converts public docs, sites and data into agent-optimized context packages with traceable evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "boto3",
    "structlog",
    "httpx",
    "lxml>=6.1.3",
    "readability-lxml>=0.9",
    "extruct>=0.18.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "syrupy",
    "boto3-stubs[s3]",
    "trustme>=1.2",
]
# bench: filled in M2 (benchmark harness). Declared placeholder for now.
bench = []

[tool.ruff]
target-version = "py312"
# docs/ holds illustrative spec snippets, not source; do not lint or format them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# tests/ and bench/ are more permissive than strict app/ code.
[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# Third-party HTML/metadata parsers used by app/extract ship no type stubs
# (lxml-stubs is incomplete; readability-lxml and extruct ship none). The M3
# extraction code is still strictly typed at its own boundaries.
[[tool.mypy.overrides]]
module = ["lxml.*", "readability.*", "extruct.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real Postgres/S3 (SeaweedFS) services",
    "allow_network: loopback-server tests that opt out of the no-network guard",
]
