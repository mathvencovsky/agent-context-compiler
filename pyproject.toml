[project]
name = "nina"
version = "0.1.0"
description = "NINA: converts public docs, sites and data into agent-optimized context packages with traceable evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "boto3",
    "structlog",
    "httpx",
    "lxml>=6.1.3",
    "readability-lxml>=0.9",
    "extruct>=0.18.0",
    "playwright>=1.40",
    "pdfplumber>=0.11",
    "tiktoken>=0.7,<1",
    # pgvector: PostgreSQL License (permissive, allowed by CLAUDE.md). Runtime
    # dep for the ORM Vector column added in FEAT-002; pinned here so the
    # lockfile settles once (see DECISIONS.md 2026-10-12).
    "pgvector>=0.3",
    # mcp: official Model Context Protocol SDK. MIT-licensed (confirmed in the
    # PyPI license classifier), satisfying the MIT/BSD/Apache-2.0 rule in
    # CLAUDE.md. Powers app/mcp_server/ (FEAT-003); see DECISIONS.md.
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "syrupy",
    "boto3-stubs[s3]",
    "trustme>=1.2",
    "reportlab>=4",
    # hypothesis: property-based testing for the chunker (M6). BSD-licensed.
    "hypothesis>=6",
]
# bench: benchmark harness (M2). trafilatura>=2 is Apache-2.0 (versions <1.8
# were GPLv3+ and are forbidden by CLAUDE.md); rank-bm25 is Apache-2.0 (pulls
# numpy BSD); the openai/anthropic SDKs are Apache-2.0 and stay behind the
# app.providers.llm interfaces (tests use only the deterministic fake).
bench = [
    "trafilatura>=2",
    "rank-bm25",
    "openai",
    "anthropic",
    "pyyaml",
]

[tool.uv]
# Install the benchmark harness group on a plain `uv sync` too (not just `dev`),
# so the M2 verification (`uv sync` then `import trafilatura, rank_bm25, openai,
# anthropic`) resolves without an explicit `--group bench`.
default-groups = ["dev", "bench"]

[tool.ruff]
target-version = "py312"
# docs/ holds illustrative spec snippets, not source; do not lint or format them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# tests/ and bench/ are more permissive than strict app/ code.
[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# Third-party HTML/metadata parsers used by app/extract ship no type stubs
# (lxml-stubs is incomplete; readability-lxml and extruct ship none). The M3
# extraction code is still strictly typed at its own boundaries.
[[tool.mypy.overrides]]
module = ["lxml.*", "readability.*", "extruct.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real Postgres/S3 (SeaweedFS) services",
    "allow_network: loopback-server tests that opt out of the no-network guard",
    "browser: tests that require a real Chromium (Playwright); run in a dedicated CI step",
]
