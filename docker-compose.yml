# NINA local infrastructure (dev only).
# All values come from .env (copy .env.example -> .env). No secrets live here.
# Object storage is SeaweedFS (Apache-2.0, S3-compatible) instead of MinIO:
# MinIO stopped publishing free community images in Oct/2025 and is AGPL-3.0,
# which CLAUDE.md forbids. See DECISIONS.md (2026-10-11). In production (M10)
# the S3 target is managed AWS S3; boto3 and the S3 contracts are unchanged.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: Docker publishes ports around host firewalls, and this
    # Postgres uses dev credentials (security audit 2026-10-28, M6).
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS S3 gateway. `server -s3` brings up master+volume+filer+S3 on 8333.
  # Anonymous S3 access is OFF: the gateway gets one identity built from
  # S3_ACCESS_KEY/S3_SECRET_KEY (the same values app.config uses), so nobody
  # without them can read or rewrite the cached IR (security audit 2026-10-28,
  # M6). The same container creates the bucket with
  # `weed shell` (idempotent), replacing a 567 MB aws-cli init image
  # (docs/ONBOARDING.md); it is healthy only once the bucket answers.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # -ip.bind=0.0.0.0 makes the S3 gateway listen on loopback too, so the
    # in-container healthcheck can reach it via localhost.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"nina","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "${S3_ACCESS_KEY:-nina-dev-access-key}" "${S3_SECRET_KEY:-nina-dev-secret-key}" > /tmp/s3.json &&
        weed server -s3 -s3.config=/tmp/s3.json -dir=/data -ip.bind=0.0.0.0 &
        until echo "s3.bucket.list" | weed shell 2>/dev/null | grep -qw "${S3_BUCKET}"; do
        echo "s3.bucket.create -name ${S3_BUCKET}" | weed shell >/dev/null 2>&1; sleep 2;
        done; wait
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweed_data:/data
    healthcheck:
      # Anonymous requests now get 403, so check the bucket through weed shell
      # and that the S3 port answers at all.
      test: ["CMD-SHELL", "echo s3.bucket.list | weed shell 2>/dev/null | grep -qw ${S3_BUCKET} && nc -z localhost 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg_data:
  seaweed_data:
