# NINA local infrastructure (dev only).
# All values come from .env (copy .env.example -> .env). No secrets live here.
# Object storage is SeaweedFS (Apache-2.0, S3-compatible) instead of MinIO:
# MinIO stopped publishing free community images in Oct/2025 and is AGPL-3.0,
# which CLAUDE.md forbids. See DECISIONS.md (2026-10-11). In production (M10)
# the S3 target is managed AWS S3; boto3 and the S3 contracts are unchanged.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS S3 gateway. `server -s3` brings up master+volume+filer+S3 on 8333.
  # Default dev mode allows anonymous S3 access (no static credentials file),
  # so S3_ACCESS_KEY/S3_SECRET_KEY are ignored locally and only matter against
  # real AWS in production. The same container creates the bucket with
  # `weed shell` (idempotent), replacing a 567 MB aws-cli init image
  # (docs/ONBOARDING.md); it is healthy only once the bucket answers.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # -ip.bind=0.0.0.0 makes the S3 gateway listen on loopback too, so the
    # in-container healthcheck can reach it via localhost.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        weed server -s3 -dir=/data -ip.bind=0.0.0.0 &
        until echo "s3.bucket.list" | weed shell 2>/dev/null | grep -qw "${S3_BUCKET}"; do
        echo "s3.bucket.create -name ${S3_BUCKET}" | weed shell >/dev/null 2>&1; sleep 2;
        done; wait
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/${S3_BUCKET} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg_data:
  seaweed_data:
