      - https://www.rfc-editor.org/rfc/rfc9111.pdf   # PDF 2: HTTP Caching
      - https://www.rfc-editor.org/rfc/rfc9112.pdf   # PDF 3: HTTP/1.1

  - site: Docker Documentation
