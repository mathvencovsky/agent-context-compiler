  - site: RFC Editor
    key: rfc
    categories: [protocol_specification, standards, pdf]
    content: mixed   # 2 páginas HTML + 3 PDFs
    render: auto
    urls:
      - https://www.rfc-editor.org/rfc/rfc9110.html
      - https://www.rfc-editor.org/rfc/rfc9111.html
