# PDF "facts" set for the M10b extraction eval (Phase P, step 1).
#
# Every fact was written by reading the rendered page (pypdfium2 render at
# 1.3x, looked at by eye), not copied from any extractor's output, on
# 2026-10-28, before any change to app/extract/pdf.py. Facts are fixed: do not
# edit one to make a change pass. Adding a document or a fact is allowed only
# in a commit of its own, made before the measurement it affects.
#
# Matching rules (bench/extract_eval/metrics.py):
#   present   - the string appears in the document text with whitespace
#               collapsed (blocks joined by a newline). Exact characters: no
#               ligature folding, no de-hyphenation by the harness.
#   headings  - the string is contained in the text of some heading block.
#   title     - contained in metadata.title, or in the heading blocks of
#               pages 1-2 joined by a space.
#   order     - both strings present and the first occurs before the second.
#   tables    - table-block count within [min, max]; each cell string equals
#               (whitespace-collapsed) some header or body cell of a table.
#   paragraphs- number of text blocks (every type except heading and table)
#               on that physical page (1-based) within [min, max].
#
# The data is never committed: `make extract-eval` downloads each file and
# checks the sha256. License of each document is recorded below.

documents:
  - id: riscv_spec_20191213
    description: "RISC-V ISA Manual, Vol. I, 20191213 (pdfTeX, 238 pages)"
    producer: pdfTeX
    download_url: https://github.com/riscv/riscv-isa-manual/releases/download/Ratified-IMAFDQC/riscv-spec-20191213.pdf
    sha256: f392624cc815cd3f259413cbd9ae2f38678ee930878855a0f4673019410d7554
    license: CC-BY-4.0
    license_url: https://raw.githubusercontent.com/riscv/riscv-isa-manual/66bed2470f68520fadc4bf86c6c000d817fe73f2/LICENSE
    license_sha256: cce5d01fa4a83b794271bd2c28cffdf99afd43c803e6ddefddae39b591ea7448
    attribution: "The RISC-V Instruction Set Manual, Volume I: Unprivileged ISA, Document Version 20191213, eds. Andrew Waterman and Krste Asanovic, RISC-V Foundation; CC-BY-4.0; https://github.com/riscv/riscv-isa-manual (release Ratified-IMAFDQC)"
    facts:
      title: "The RISC-V Instruction Set Manual"
      headings:
        - "Introduction"
        - "RV32I Base Integer Instruction Set"
      present:
        - "is a new instruction-set architecture (ISA) that was originally designed to support computer architecture research and education"
        - "microcoded, in-order, decoupled, out-of-order"
        - "A fully virtualizable ISA to ease hypervisor development."
        - "An ISA that simplifies experiments with new privileged architecture designs."
        - "Commentary on our design decisions is formatted as in this paragraph."
        - "This chapter describes version 2.0 of the RV32I base integer instruction set."
        - "Register x0 is hardwired with all bits equal to 0."
        - "There is one additional unprivileged register: the program counter pc holds the address of the current instruction."
        - "Most of the commentary for RV32I also applies to the RV64I base."
      order:
        - ["Our goals in defining RISC-V include", "A fully virtualizable ISA to ease hypervisor development."]
      paragraphs:
        - {page: 19, min: 2, max: 16}
        - {page: 31, min: 5, max: 10}

