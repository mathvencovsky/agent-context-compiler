# Preços dos modelos usados no benchmark (USD por 1M de tokens).
# Preenchido pelo humano (2026-10-11). Fonte: páginas de pricing dos provedores.
# Usado por bench/report.py para o custo estimado por tarefa e por tarefa concluída.
#
# Papéis no benchmark (ver bench/answer.py e bench/grade.py):
#   - answerer (respondedor): OpenAI gpt-6.1-sol   (tier meio)
#   - judge    (juiz):        Anthropic claude-sonnet-5-5  (tier meio, modelo diferente do respondedor)
# Escolha do humano (2026-10-11): usar o tier meio de cada provedor.
#
# Os valores abaixo são preços de catálogo; atualize quando os provedores mudarem.

selected:
  answerer: gpt-6.1-sol
  judge: claude-sonnet-5-5

models:
  # ---- OpenAI (respondedor) ----
  gpt-6-luna:
    provider: openai
    input_usd_per_1m: 0.10
    output_usd_per_1m: 0.50
  gpt-6.1-sol:
    provider: openai
    input_usd_per_1m: 2.00
    output_usd_per_1m: 10.00
  gpt-6-astra:
    provider: openai
    input_usd_per_1m: 10.00
    output_usd_per_1m: 50.00

  # ---- Anthropic / Claude (juiz) ----
  claude-haiku-5-5:
    provider: anthropic
    input_usd_per_1m: 0.10
    output_usd_per_1m: 0.50
    # M10 webfetch_live: o WebFetch lê cada página com este modelo (até 100 mil
    # caracteres por chamada, sempre abaixo da faixa de prompts > 100 mil tokens).
    # Cache pela página de preços da Anthropic (2026-10-16): escrita com TTL de
    # 5 min (com TTL de 1 h seria 0.20) e leitura. O humano confere antes do piloto.
    cache_write_usd_per_1m: 0.125
    cache_read_usd_per_1m: 0.01
  claude-sonnet-5-5:
    provider: anthropic
    input_usd_per_1m: 2.00
    output_usd_per_1m: 10.00
    # M10 agent. Cache from the Anthropic prompt-caching pricing table
    # (docs.claude.com, read 2026-10-28): 5-minute writes (the harness pins
    # FORCE_PROMPT_CACHING_5M, PREREG Amendment 12; 1-hour writes would be
    # 4.00) and hits at 0.05x input.
    cache_write_usd_per_1m: 2.50
    cache_read_usd_per_1m: 0.10
  claude-opus-5-5:
    provider: anthropic
    input_usd_per_1m: 4.00
    output_usd_per_1m: 20.00
    # Same table: 5-minute writes (1-hour: 8.00), hits at 0.05x input.
    cache_write_usd_per_1m: 5.00
    cache_read_usd_per_1m: 0.20
